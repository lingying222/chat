<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录导航</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #e6ebf1;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #eff4ff;
      --folder: #f59e0b;
      --shadow: 0 1px 3px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 14px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    }
    header h1 { font-size: 19px; font-weight: 700; }
    header .meta { color: var(--muted); font-size: 13px; }
    header .spacer { flex: 1; }
    label.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
    main { max-width: 1080px; margin: 0 auto; padding: 28px 28px 72px; }
    .section-title { font-size: 15px; font-weight: 600; margin: 24px 0 12px; color: var(--text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 22px; box-shadow: var(--shadow); color: var(--text);
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .card:hover {
      border-color: var(--primary); transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(15, 23, 42, .10);
    }
    .card-main { display: block; text-decoration: none; color: inherit; min-width: 0; }
    .card .title {
      font-size: 15px; font-weight: 600; margin-bottom: 8px; line-height: 1.4;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card .sub {
      font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px;
    }
    .folder { border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 14px; overflow: hidden; }
    .folder-head {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none;
    }
    .folder-head:hover { background: var(--primary-soft); }
    .folder-head .icon { font-size: 18px; }
    .folder-head .name { font-weight: 600; }
    .folder-head .count { font-size: 12px; color: var(--muted); }
    .folder-head .chevron { margin-left: auto; color: var(--muted); transition: transform .15s; }
    .folder.open .folder-head .chevron { transform: rotate(90deg); }
    .folder-body { display: none; padding: 0 16px 16px; }
    .folder.open .folder-body { display: block; }
    .folder-body .grid { margin-top: 4px; }
    .empty { color: var(--muted); font-size: 14px; padding: 24px 0; }
    .badge { display: inline-block; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 3px 12px; font-size: 12px; }
    .group { margin-bottom: 4px; }
    .group-head { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 14px; }
    .group-title { font-size: 16px; font-weight: 700; }
    .group-count { font-size: 12px; color: var(--muted); }
    .group-latest { background: #ecfdf5; color: #059669; border-radius: 999px; padding: 1px 9px; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>📁 目录导航</h1>
    <span class="badge" id="summary">—</span>
    <span class="spacer"></span>
    <span class="meta" id="updatedAt"></span>
    <label class="switch"><input type="checkbox" id="autoRefresh" checked> 自动刷新（5 秒）</label>
  </header>

  <main id="main">
    <div id="groups"></div>
    <div class="empty" id="emptyTip" style="display:none">当前目录暂无 HTML 页面。</div>
  </main>

  <script src="manifest.js"></script>
  <script>
    const state = { data: null, timer: null };

    function loadManifest() {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "manifest.js?t=" + Date.now();
        script.onload = () => { resolve(window.__MANIFEST__); script.remove(); };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function fileCard(file) {
      const wrap = document.createElement("div");
      wrap.className = "card";

      const a = document.createElement("a");
      a.className = "card-main";
      a.href = file.path;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML =
        '<div class="title" title="' + escapeHtml(file.title) + '">📄 ' + escapeHtml(file.title) + "</div>" +
        '<div class="sub"><span>' + escapeHtml(file.name) + "</span><span>" + escapeHtml(splitDate(file).label) + "</span></div>";

      wrap.appendChild(a);
      return wrap;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function collectFiles(node, acc) {
      node.files.forEach(f => acc.push(f));
      node.folders.forEach(sub => collectFiles(sub, acc));
      return acc;
    }

    function splitDate(file) {
      const m = file.name.match(/(\d{4}-\d{2}-\d{2})/);
      if (m) return { label: m[1], sort: m[1] };
      return { label: "未知日期", sort: "0000-00-00" };
    }

    function render() {
      const root = state.data.root;
      const all = collectFiles(root, []);

      const groups = new Map();
      all.forEach(f => {
        const d = splitDate(f);
        if (!groups.has(d.sort)) groups.set(d.sort, { label: d.label, files: [] });
        groups.get(d.sort).files.push(f);
      });

      const box = document.getElementById("groups");
      box.innerHTML = "";
      const keys = Array.from(groups.keys()).sort((a, b) => b.localeCompare(a));

      keys.forEach((sort, idx) => {
        const g = groups.get(sort);
        const files = g.files.slice().sort((a, b) => b.name.localeCompare(a.name));
        const el = document.createElement("div");
        el.className = "group";
        const head = document.createElement("div");
        head.className = "group-head";
        const latest = idx === 0 ? '<span class="group-latest">最新</span>' : "";
        head.innerHTML =
          '<span class="group-title">📅 ' + escapeHtml(g.label) + "</span>" +
          '<span class="group-count">' + files.length + " 条</span>" + latest;
        const grid = document.createElement("div");
        grid.className = "grid";
        files.forEach(f => grid.appendChild(fileCard(f)));
        el.appendChild(head);
        el.appendChild(grid);
        box.appendChild(el);
      });

      document.getElementById("summary").textContent = all.length + " 个页面 · " + keys.length + " 天";
      document.getElementById("updatedAt").textContent = "清单随目录自动更新";
      document.getElementById("emptyTip").style.display = all.length === 0 ? "block" : "none";
    }

    async function refresh() {
      try {
        state.data = await loadManifest();
        render();
      } catch (e) {
        console.warn("manifest 加载失败", e);
      }
    }

    document.getElementById("autoRefresh").addEventListener("change", e => {
      if (e.target.checked) {
        state.timer = setInterval(refresh, 5000);
      } else {
        clearInterval(state.timer);
      }
    });

    refresh().then(() => { state.timer = setInterval(refresh, 5000); });
  </script>
</body>
</html>
