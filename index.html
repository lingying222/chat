<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录导航</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #e6ebf1;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #eff4ff;
      --folder: #f59e0b;
      --shadow: 0 1px 3px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header .meta { color: var(--muted); font-size: 13px; }
    header .spacer { flex: 1; }
    label.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 24px 64px; }
    .section-title { font-size: 15px; font-weight: 600; margin: 24px 0 12px; color: var(--text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; box-shadow: var(--shadow); text-decoration: none; color: var(--text);
      transition: border-color .15s, transform .15s; display: block;
    }
    .card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .card.long-pressed { border-color: #ef4444; background: #fef2f2; }
    .card .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .sub { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .folder { border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 14px; overflow: hidden; }
    .folder-head {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none;
    }
    .folder-head:hover { background: var(--primary-soft); }
    .folder-head .icon { font-size: 18px; }
    .folder-head .name { font-weight: 600; }
    .folder-head .count { font-size: 12px; color: var(--muted); }
    .folder-head .chevron { margin-left: auto; color: var(--muted); transition: transform .15s; }
    .folder.open .folder-head .chevron { transform: rotate(90deg); }
    .folder-body { display: none; padding: 0 16px 16px; }
    .folder.open .folder-body { display: block; }
    .folder-body .grid { margin-top: 4px; }
    .empty { color: var(--muted); font-size: 14px; padding: 24px 0; }
    .badge { display: inline-block; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
    .group { margin-bottom: 8px; }
    .group-head { display: flex; align-items: baseline; gap: 10px; margin: 24px 0 12px; }
    .group-title { font-size: 16px; font-weight: 700; }
    .group-count { font-size: 12px; color: var(--muted); }
    .group-latest { background: #ecfdf5; color: #059669; border-radius: 999px; padding: 1px 9px; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>📁 目录导航</h1>
    <span class="badge" id="summary">—</span>
    <span class="spacer"></span>
    <span class="meta" id="updatedAt"></span>
    <span class="meta" style="color:#ef4444">长按卡片 0.6 秒可删除对应记录</span>
    <label class="switch"><input type="checkbox" id="autoRefresh" checked> 自动刷新（5 秒）</label>
  </header>

  <main id="main">
    <div id="groups"></div>
    <div class="empty" id="emptyTip" style="display:none">当前目录暂无 HTML 页面。</div>
  </main>

  <script src="manifest.js"></script>
  <script>
    const state = { data: null, timer: null };

    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 / 1024).toFixed(2) + " MB";
    }

    function loadManifest() {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "manifest.js?t=" + Date.now();
        script.onload = () => { resolve(window.__MANIFEST__); script.remove(); };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    const DELETE_API = "http://127.0.0.1:8765";
    const LONG_PRESS_MS = 600;

    async function deleteFile(file) {
      if (!confirm("删除这条聊天记录？\n\n标题：" + file.title + "\n文件：" + file.name + "\n\n删除后本地文件一并移除，不可恢复。")) return;
      try {
        const r = await fetch(DELETE_API + "/delete?path=" + encodeURIComponent(file.path), { method: "POST" });
        const data = await r.json();
        if (!data.ok) throw new Error(data.message || "删除失败");
        await refresh();
      } catch (e) {
        alert("删除失败：本地删除服务未启动。\n请先双击「启动删除服务.bat」，再回到本页长按删除。\n线上静态页面无法直接删除文件。");
      }
    }

    function bindLongPress(card, file) {
      let timer = null;
      let fired = false;
      let sx = 0, sy = 0;

      const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };

      card.addEventListener("pointerdown", (e) => {
        fired = false;
        sx = e.clientX; sy = e.clientY;
        clear();
        timer = setTimeout(() => {
          fired = true;
          card.classList.add("long-pressed");
          deleteFile(file);
        }, LONG_PRESS_MS);
      });
      card.addEventListener("pointermove", (e) => {
        if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clear();
      });
      card.addEventListener("pointerup", clear);
      card.addEventListener("pointerleave", clear);
      card.addEventListener("pointercancel", clear);
      card.addEventListener("click", (e) => {
        if (fired) { e.preventDefault(); e.stopPropagation(); }
      });
    }

    function fileCard(file) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = file.path;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML =
        '<div class="title" title="' + escapeHtml(file.title) + '">📄 ' + escapeHtml(file.title) + "</div>" +
        '<div class="sub"><span>' + escapeHtml(file.name) + "</span><span>" + file.mtime + "</span><span>" + fmtSize(file.size) + "</span></div>";
      bindLongPress(a, file);
      return a;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function collectFiles(node, acc) {
      node.files.forEach(f => acc.push(f));
      node.folders.forEach(sub => collectFiles(sub, acc));
      return acc;
    }

    function splitDate(file) {
      const m = file.name.match(/(\d{4}-\d{2}-\d{2})/);
      if (m) return { label: m[1], sort: m[1] };
      if (file.mtime && file.mtime.length >= 10) return { label: file.mtime.slice(0, 10), sort: file.mtime.slice(0, 10) };
      return { label: "未知日期", sort: "0000-00-00" };
    }

    function render() {
      const root = state.data.root;
      const all = collectFiles(root, []);

      const groups = new Map();
      all.forEach(f => {
        const d = splitDate(f);
        if (!groups.has(d.sort)) groups.set(d.sort, { label: d.label, files: [] });
        groups.get(d.sort).files.push(f);
      });

      const box = document.getElementById("groups");
      box.innerHTML = "";
      const keys = Array.from(groups.keys()).sort((a, b) => b.localeCompare(a));

      keys.forEach((sort, idx) => {
        const g = groups.get(sort);
        const files = g.files.slice().sort((a, b) => b.mtime.localeCompare(a.mtime));
        const el = document.createElement("div");
        el.className = "group";
        const head = document.createElement("div");
        head.className = "group-head";
        const latest = idx === 0 ? '<span class="group-latest">最新</span>' : "";
        head.innerHTML =
          '<span class="group-title">📅 ' + escapeHtml(g.label) + "</span>" +
          '<span class="group-count">' + files.length + " 条</span>" + latest;
        const grid = document.createElement("div");
        grid.className = "grid";
        files.forEach(f => grid.appendChild(fileCard(f)));
        el.appendChild(head);
        el.appendChild(grid);
        box.appendChild(el);
      });

      document.getElementById("summary").textContent = all.length + " 个页面 · " + keys.length + " 天";
      document.getElementById("updatedAt").textContent = "清单随目录自动更新";
      document.getElementById("emptyTip").style.display = all.length === 0 ? "block" : "none";
    }

    async function refresh() {
      try {
        state.data = await loadManifest();
        render();
      } catch (e) {
        console.warn("manifest 加载失败", e);
      }
    }

    document.getElementById("autoRefresh").addEventListener("change", e => {
      if (e.target.checked) {
        state.timer = setInterval(refresh, 5000);
      } else {
        clearInterval(state.timer);
      }
    });

    refresh().then(() => { state.timer = setInterval(refresh, 5000); });
  </script>
</body>
</html>
