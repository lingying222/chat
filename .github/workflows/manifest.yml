name: 更新目录清单

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 manifest
        run: python build_manifest.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.js manifest.json
          if git diff --cached --quiet; then
            echo "清单无变化"
          else
            git commit -m "chore: 自动更新目录清单 [skip ci]"
            git push
          fi
